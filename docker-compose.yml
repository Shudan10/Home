# Quick Start Home stack.
#
# This file is used by two different clients: the installer running on the host,
# and the manager container running `docker compose` against the same stack.
# That split decides how each path must be written:
#
#   volumes:       resolved by the Docker *daemon*, so they must be host paths
#                  -> always ${STACK_DIR}/..., never relative.
#   build.context: resolved by the *client* before upload, so it must be
#                  relative -> ./nextcloud resolves to $STACK_DIR/nextcloud on
#                  the host and to /stack/nextcloud inside the manager, both
#                  correct.
#
# Getting either backwards produces mounts pointing at nothing.
#
# The optional apps publish no ports here on purpose -- the port mappings live
# in the generated override at conf/apps-ports.yml so the web UI can toggle
# them. Compose concatenates `ports` across files, so the base must leave the
# list empty.

name: quickstart-home

services:
  # ---- Nextcloud ------------------------------------------------------------
  #
  # Behind the "nextcloud" profile, so none of it exists until it is installed
  # from the panel. Four containers: the app, its database, a Redis for file
  # locking and caching, and Imaginary for image previews.
  nextcloud-db:
    image: mariadb:10.11
    container_name: quickstart-home-nextcloud-db
    hostname: nextcloud-db
    profiles: ["nextcloud"]
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-}
    volumes:
      - nextcloud-db-data:/var/lib/mysql
    networks:
      - home
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Only a cache and Nextcloud's file-locking store, both rebuilt on demand, so
  # nothing here is worth keeping across a restart. The image declares
  # VOLUME /data, which without a mount there means a fresh anonymous volume
  # every time the container is recreated -- each one orphaned by the next,
  # and invisible to every teardown list because it has no name. A tmpfs
  # satisfies the VOLUME, and with snapshots and the append-only log off
  # Redis never writes to it anyway.
  nextcloud-redis:
    image: redis:7-alpine
    container_name: quickstart-home-nextcloud-redis
    hostname: nextcloud-redis
    profiles: ["nextcloud"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data:size=16m
    networks:
      - home
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # Generates image previews, including iPhone HEIC.
  nextcloud-imaginary:
    image: nextcloud/aio-imaginary:latest
    container_name: quickstart-home-nextcloud-imaginary
    hostname: nextcloud-imaginary
    profiles: ["nextcloud"]
    restart: unless-stopped
    cap_add: ["SYS_NICE"]
    environment:
      IMAGINARY_SECRET: ${NEXTCLOUD_IMAGINARY_SECRET:-}
    networks:
      - home
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  nextcloud:
    image: quickstart-home/nextcloud:1
    build:
      context: ./nextcloud
      # The upstream tag the image is built FROM. "stable" unless .env says
      # otherwise; teardown and uninstall.sh read the same key to remove it.
      args:
        NEXTCLOUD_TAG: ${NEXTCLOUD_TAG:-stable}
    container_name: quickstart-home-nextcloud
    hostname: nextcloud
    profiles: ["nextcloud"]
    restart: unless-stopped
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      # The docker bridge range, so Nextcloud believes the X-Forwarded-For the
      # reverse proxy sets rather than logging every visitor as the proxy.
      TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - nextcloud-data:/var/www/html
    networks:
      - home
    depends_on:
      - nextcloud-db
      - nextcloud-redis
      - nextcloud-imaginary
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- KaChat Nextcloud -----------------------------------------------------
  #
  # A second Nextcloud, only for the KaChat and KaPay apps: their photo, video
  # and voice links, their encrypted contacts backup, and Nextcloud Talk for
  # KaChat calls. Separate from the personal Nextcloud above in every way --
  # its own database, cache, volumes and image tag -- so publishing it on a
  # domain exposes nothing of that one, and rebuilding one never touches the
  # other. lib/kachat.js runs it.
  #
  # No port on the machine: it is reached through the Cloudflare tunnel, which
  # only lets through what the two apps use (see lib/kachat.js), and by the
  # panel over the stack network.
  kachat-db:
    image: mariadb:10.11
    container_name: quickstart-home-kachat-db
    hostname: kachat-db
    profiles: ["kachat"]
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${KACHAT_DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${KACHAT_DB_PASSWORD:-}
    volumes:
      - kachat-db-data:/var/lib/mysql
    networks:
      - home
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Cache and file locking only; see nextcloud-redis for why it is a tmpfs.
  kachat-redis:
    image: redis:7-alpine
    container_name: quickstart-home-kachat-redis
    hostname: kachat-redis
    profiles: ["kachat"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data:size=16m
    networks:
      - home
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  kachat-nextcloud:
    # Its own tag, built from the same Dockerfile (ffmpeg, so videos get
    # thumbnails), so the two Nextclouds update independently.
    image: quickstart-home/kachat-nextcloud:1
    build:
      context: ./nextcloud
      args:
        NEXTCLOUD_TAG: ${KACHAT_NEXTCLOUD_TAG:-stable}
    container_name: quickstart-home-kachat-nextcloud
    hostname: kachat-nextcloud
    profiles: ["kachat"]
    restart: unless-stopped
    environment:
      MYSQL_HOST: kachat-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${KACHAT_DB_PASSWORD:-}
      REDIS_HOST: kachat-redis
      # An admin nobody uses: long, random, never shown. The apps sign in to
      # accounts of their own, with app passwords the panel makes.
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${KACHAT_ADMIN_PASSWORD:-}
      NEXTCLOUD_TRUSTED_DOMAINS: kachat-nextcloud localhost
      # The tunnel connector and the panel, both on the docker bridge. The
      # connector says the visitor came over https; the panel says nothing and
      # is answered over http, which is right for it.
      TRUSTED_PROXIES: 172.16.0.0/12
      # A single upload from KaChat is one request, and Cloudflare stops a
      # request at 100 MB on its free plan anyway.
      PHP_UPLOAD_LIMIT: 1G
    volumes:
      - kachat-data:/var/www/html
    networks:
      - home
    depends_on:
      - kachat-db
      - kachat-redis
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- Jellyfin -------------------------------------------------------------
  #
  # Behind the "jellyfin" profile. Pulled rather than built: upstream publishes
  # an official image and building a media server from source is a large job
  # nobody does, so there is no ref to track here.
  #
  # Its media folders are not listed here. They are host directories only the
  # person installing this knows the paths of, so the panel writes them into
  # conf/apps-ports.yml alongside the published port -- same arrangement, and
  # for the same reason: neither is knowable when this file is written.
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-latest}
    container_name: quickstart-home-jellyfin
    hostname: jellyfin
    profiles: ["jellyfin"]
    restart: unless-stopped
    environment:
      # Jellyfin builds absolute URLs from this when it is behind a proxy on a
      # path rather than at a root. Empty means "I am at the root", which is the
      # usual case; the panel sets it when it publishes Jellyfin under a prefix.
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_URL:-}
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
    networks:
      - home
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- Meal Plan ------------------------------------------------------------
  # Built from its own repository rather than pulled: it is part of this project
  # but lives separately, so the panel tracks a branch of it the same way it
  # tracks its own. The override file rewrites this context when the ref is
  # changed; the value here is the default a bare `docker compose` would use.
  mealplan:
    image: quickstart-home/mealplan:1
    build:
      context: https://github.com/Shudan10/MealPlan.git#${MEALPLAN_REF:-main}
    container_name: quickstart-home-mealplan
    hostname: mealplan
    profiles: ["mealplan"]
    restart: unless-stopped
    environment:
      # Without a hash there is no password, and anybody who reaches the port
      # can rewrite the family's week. The panel always sets one.
      MEALPLAN_PASSWORD_HASH: ${MEALPLAN_PASSWORD_HASH:-}
      # Its own, never the panel's. Both sign a session as "<expiry>.<nonce>"
      # with an HMAC, so a shared secret would make the two interchangeable:
      # a family member could take the Meal Plan cookie everyone is given and
      # present it to the panel, which holds the Docker socket. Different
      # cookie names do not prevent that -- the attacker chooses the name.
      SESSION_SECRET: ${MEALPLAN_SESSION_SECRET:-}
    volumes:
      - mealplan-data:/data
    networks:
      - home
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- Minecraft ------------------------------------------------------------
  #
  # One world that Java Edition and Bedrock Edition (phones, tablets, Windows,
  # consoles) can both join. The server is Paper; Geyser translates Bedrock's
  # protocol on UDP 19132, and Floodgate lets Bedrock players sign in with their
  # Xbox account instead of needing a Java one. The image downloads all three
  # when it starts, so a restart is also how they are kept current.
  #
  # Every gameplay setting comes from .env, written by the panel, and the image
  # turns them into server.properties on each start. The allow list, operators
  # and bans are deliberately not here: they are the server's own files, which
  # the game changes too, and the panel edits those directly.
  minecraft:
    image: itzg/minecraft-server:${MINECRAFT_IMAGE_VERSION:-latest}
    container_name: quickstart-home-minecraft
    hostname: minecraft
    profiles: ["minecraft"]
    restart: unless-stopped
    # Stopping saves the world, and a big one takes longer than Docker's
    # default ten seconds. Cut short, the last few minutes of play are lost.
    stop_grace_period: 2m
    environment:
      # Mojang's licence. FALSE until it is accepted in the panel, and the
      # server will not start without it.
      EULA: ${MINECRAFT_EULA:-FALSE}
      TYPE: PAPER
      VERSION: ${MINECRAFT_VERSION:-LATEST}
      # Which folder in the data volume is the world. Worlds tab in the panel.
      LEVEL: ${MINECRAFT_LEVEL:-world}
      MEMORY: ${MINECRAFT_MEMORY:-2G}
      USE_AIKAR_FLAGS: "true"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
      MOTD: ${MINECRAFT_MOTD:-A Minecraft server at home}
      MODE: ${MINECRAFT_MODE:-survival}
      DIFFICULTY: ${MINECRAFT_DIFFICULTY:-easy}
      HARDCORE: ${MINECRAFT_HARDCORE:-false}
      PVP: ${MINECRAFT_PVP:-true}
      MAX_PLAYERS: ${MINECRAFT_MAX_PLAYERS:-10}
      VIEW_DISTANCE: ${MINECRAFT_VIEW_DISTANCE:-10}
      SIMULATION_DISTANCE: ${MINECRAFT_SIMULATION_DISTANCE:-10}
      SPAWN_PROTECTION: ${MINECRAFT_SPAWN_PROTECTION:-16}
      ALLOW_NETHER: ${MINECRAFT_ALLOW_NETHER:-true}
      ALLOW_FLIGHT: ${MINECRAFT_ALLOW_FLIGHT:-false}
      ENABLE_COMMAND_BLOCK: ${MINECRAFT_COMMAND_BLOCKS:-false}
      FORCE_GAMEMODE: ${MINECRAFT_FORCE_GAMEMODE:-false}
      ONLINE_MODE: ${MINECRAFT_ONLINE_MODE:-true}
      SEED: ${MINECRAFT_SEED:-}
      LEVEL_TYPE: ${MINECRAFT_LEVEL_TYPE:-minecraft:normal}
      # Taking someone off the allow list also puts them out of the game,
      # rather than letting them play on until they next log in.
      ENFORCE_WHITELIST: "true"
    volumes:
      - minecraft-data:/data
    networks:
      - home
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- The panel ------------------------------------------------------------
  manager:
    image: quickstart-home/manager:1
    build:
      context: ./manager
    container_name: quickstart-home-manager
    hostname: manager
    restart: unless-stopped
    environment:
      STACK_DIR: ${STACK_DIR}
      COMPOSE_PROJECT_NAME: quickstart-home
      TUNNEL_CONTAINER: quickstart-home-tunnel
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      STACK_REPO: ${STACK_REPO:-Shudan10/Home}
      GUI_PORT: ${GUI_PORT:-8420}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACK_DIR}:/stack
    ports:
      - "${MANAGER_BIND:-0.0.0.0}:${GUI_PORT:-8420}:8080"
    networks:
      - home
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The Cloudflare Tunnel connector. Every published app is reached through it:
  # it dials out to Cloudflare, and requests for a published name come back
  # down that connection to the app on this network. Nothing listens on the
  # internet, so there are no ports to forward and no certificates to renew.
  #
  # Behind a profile because it has nothing to do until an account is
  # connected; the panel starts it then, with the run token it got from
  # Cloudflare. The version is pinned so an update is a decision, and the
  # panel's teardown names the same tag.
  tunnel:
    image: cloudflare/cloudflared:${TUNNEL_VERSION:-2026.10.7}
    container_name: quickstart-home-tunnel
    hostname: tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - home
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # A Tailscale exit node that sends what it carries on through Mullvad, on
  # the Mullvad account of whoever runs this. A phone or laptop that picks it
  # stays on the tailnet -- the apps here keep working -- while its web
  # traffic leaves through Mullvad. manager/mullvad/ has the routing.
  #
  # Behind a profile: nothing to do until an account is connected. The panel
  # writes the WireGuard settings it got from Mullvad into .env and starts it.
  # Its own network, not the apps' one: devices using it have no business
  # reaching the containers, and nothing here needs to reach it.
  mullvad:
    image: quickstart-home/mullvad-exit:1
    build:
      context: ./manager/mullvad
    container_name: quickstart-home-mullvad
    hostname: home-mullvad
    profiles: ["mullvad"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # The ipv6 ones need IPv6 in the host kernel. On a host booted with
    # ipv6.disable=1 those keys do not exist and Docker refuses to create the
    # container at all; drop the three net.ipv6 lines there (the exit node
    # then carries IPv4 only, which the entrypoint already copes with).
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      WG_PRIVATE_KEY: ${MULLVAD_WG_PRIVATE_KEY:-}
      WG_ADDRESS: ${MULLVAD_WG_ADDRESS:-}
      WG_ADDRESS6: ${MULLVAD_WG_ADDRESS6:-}
      WG_PEER_PUBLIC_KEY: ${MULLVAD_PEER_PUBLIC_KEY:-}
      WG_ENDPOINT: ${MULLVAD_ENDPOINT:-}
      TS_HOSTNAME: ${MULLVAD_TS_HOSTNAME:-home-mullvad}
    volumes:
      - mullvad-tailscale:/var/lib/tailscale
    networks:
      - vpn
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  home:
    name: quickstart-home-net
  vpn:
    name: quickstart-home-vpn

volumes:
  nextcloud-db-data:
    name: quickstart-home-nextcloud-db-data
  nextcloud-data:
    name: quickstart-home-nextcloud-data
  # Jellyfin's own state: the library database, artwork and settings. The media
  # itself stays where it is on the host and is only ever mounted read-only.
  jellyfin-config:
    name: quickstart-home-jellyfin-config
  jellyfin-cache:
    name: quickstart-home-jellyfin-cache
  mealplan-data:
    name: quickstart-home-mealplan-data
  # The world, the server's settings, and its allow, operator and ban lists.
  minecraft-data:
    name: quickstart-home-minecraft-data
  # The exit node's sign-in to your tailnet, so a restart or a new location
  # does not mean signing in again.
  mullvad-tailscale:
    name: quickstart-home-mullvad-tailscale
  # KaChat Nextcloud: its files (media, contacts backups) and its database.
  kachat-data:
    name: quickstart-home-kachat-data
  kachat-db-data:
    name: quickstart-home-kachat-db-data
